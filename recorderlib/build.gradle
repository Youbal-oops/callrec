plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'dev.youbal.callrec.lib'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures { aidl true }

    publishing { singleVariant('release') { withSourcesJar() } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku CLIENT only. The host app embeds this; the Shizuku/Sui daemon is installed once, separately.
    api 'dev.rikka.shizuku:api:13.1.5'
    api 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'dev.youbal.callrec'
                artifactId = 'recorderlib'
                version = '0.2.0'
            }
        }
    }
}
